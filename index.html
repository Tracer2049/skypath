<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SkyPath">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070a12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SkyPath</title>
<style>
:root{color-scheme:dark;--bg:#070a12;--fg:#eaeef7;--ac:#ffb347;--mut:#8f98ad}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px -apple-system,system-ui,sans-serif;overflow:hidden}
video,canvas{position:fixed;inset:0;width:100%;height:100%}
video{object-fit:cover;background:#000}
.bar{position:fixed;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.top{top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 24px;background:linear-gradient(#000c,#0000)}
.bot{bottom:0;padding:24px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(#0000,#000d)}
input[type=text]{flex:1;min-width:0;font:16px -apple-system,system-ui,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid #fff3;background:#000a;color:var(--fg)}
button{font:inherit;padding:10px 13px;border-radius:10px;border:1px solid #fff3;background:#000a;color:var(--fg)}
button.p{background:var(--ac);color:#15100a;border:0;font-weight:600}
#info{flex:1 1 100%;font-size:13px;line-height:1.4}
#info b{color:var(--ac)}
.fov{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex:1 1 auto}
.fov input{flex:1;min-width:80px}
#start{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:32px}
#start h1{margin:0;font:600 34px/1.1 Georgia,'Times New Roman',serif}
#start p{margin:0;max-width:30ch;color:var(--mut);line-height:1.5}
#err{color:#ff8a7a;min-height:1.2em;font-size:13px}
</style></head><body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div class="bar top">
  <input id="q" type="text" list="bl" placeholder="Object: M31, Orion Nebula, Jupiter…" autocapitalize="off" autocorrect="off" enterkeyhint="go">
  <datalist id="bl"></datalist>
  <button class="p" id="go">Track</button>
  <div id="info">Search for an object to begin.</div>
</div>
<div class="bar bot">
  <button id="span"></button><button id="cal">Calibrate</button><button id="rst">Reset</button>
  <label class="fov">View <input id="fov" type="range" min="25" max="90" step="1"><span id="fv"></span></label>
</div>
<div id="start">
  <h1>SkyPath</h1>
  <p>Follow one object across the sky through your camera. Nothing else is drawn.</p>
  <button class="p" id="begin">Allow camera, motion and location</button>
  <div id="err"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d'),vid=$('#v'),rad=Math.PI/180;
const BODIES=['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto'];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let obs=null,target=null,path=[],pathAt=0,W=0,H=0,azOff=+ls.get('azOff')||0,fov=+ls.get('fov')||55,span=+ls.get('span')||12;
const ori={a:0,b:90,g:0};
$('#bl').innerHTML=BODIES.map(b=>`<option value="${b}">`).join('');
$('#fov').value=fov;$('#fv').textContent=fov+'°';
$('#fov').oninput=e=>{fov=+e.target.value;$('#fv').textContent=fov+'°';ls.set('fov',fov)};

function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();

async function resolve(name){
  const key=name.trim().toLowerCase(),b=BODIES.find(x=>x.toLowerCase()===key);
  if(b)return{name:b,body:b};
  const cached=ls.get('obj:'+key);if(cached)return JSON.parse(cached);
  const r=await fetch('https://cds.unistra.fr/cgi-bin/nph-sesame/-oI/SNV?'+encodeURIComponent(name.trim()));
  const m=(await r.text()).match(/%J\s+([\d.]+)\s+([+-][\d.]+)/);
  if(!m)throw new Error('No match for “'+name+'”. Try another name or catalog number.');
  const o={name:name.trim(),ra:+m[1],dec:+m[2]};ls.set('obj:'+key,JSON.stringify(o));return o;
}
async function track(){
  const n=$('#q').value;if(!n.trim())return;
  $('#info').textContent='Looking up '+n+'…';
  try{target=await resolve(n);
    if(!target.body)Astronomy.DefineStar('Star1',target.ra/15,target.dec,1000);
    pathAt=0;ls.set('last',target.name);$('#q').blur();
  }catch(e){target=null;$('#info').textContent=navigator.onLine?e.message:'Offline. Only planets, Sun, Moon and previously searched objects work.'}
}
$('#go').onclick=track;$('#q').onkeydown=e=>{if(e.key==='Enter')track()};

function altaz(t){
  const d=Astronomy.Equator(target.body||'Star1',t,obs,true,true);
  return Astronomy.Horizon(t,obs,d.ra,d.dec,'normal');
}
function rot(){
  const a=(ori.a-azOff)*rad,b=ori.b*rad,g=ori.g*rad,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
  const r1=[cg,0,sg],r2=[sb*sg,cb,-sb*cg];
  return[[0,1,2].map(i=>ca*r1[i]-sa*r2[i]),[0,1,2].map(i=>sa*r1[i]+ca*r2[i]),[-cb*sg,sb,cb*cg]];
}
function proj(az,alt,R){
  const w=[Math.cos(alt*rad)*Math.sin(az*rad),Math.cos(alt*rad)*Math.cos(az*rad),Math.sin(alt*rad)];
  const d=[0,1,2].map(i=>R[0][i]*w[0]+R[1][i]*w[1]+R[2][i]*w[2]);
  const f=(H/2)/Math.tan(fov*rad/2),front=d[2]<-0.02;
  return{d,front,x:front?W/2+f*d[0]/-d[2]:0,y:front?H/2-f*d[1]/-d[2]:0};
}
const norm=x=>((x+540)%360)-180;
function camAim(R){return{az:(Math.atan2(-R[0][2],-R[1][2])/rad+360)%360,alt:Math.asin(-R[2][2])/rad}}

function frame(){
  ctx.clearRect(0,0,W,H);
  if(target&&obs){
    const now=new Date(),R=rot();
    const st=span<=6?10:span<=12?20:30;
    if(now-pathAt>20000){pathAt=+now;path=[];
      for(let i=-60/st;i<=span*60/st;i++){const t=new Date(+now+i*st*60000),p=altaz(t);path.push({i,t,az:p.azimuth,alt:p.altitude})}}
    const pts=path.map(p=>({...p,s:proj(p.az,p.alt,R)}));
    ctx.lineWidth=9;ctx.strokeStyle='#ffb347';ctx.lineCap='round';
    for(let k=1;k<pts.length;k++){const a=pts[k-1],b=pts[k];
      if(a.s.front&&b.s.front&&a.alt>0&&b.alt>0&&Math.abs(b.s.x-a.s.x)<3000){
        ctx.globalAlpha=b.i<=0?.35:1;ctx.setLineDash(b.i<=0?[16,16]:[]);
        ctx.beginPath();ctx.moveTo(a.s.x,a.s.y);ctx.lineTo(b.s.x,b.s.y);ctx.stroke()}}
    ctx.setLineDash([]);ctx.globalAlpha=1;ctx.font='700 22px -apple-system,sans-serif';ctx.fillStyle='#ffb347';
    for(const p of pts)if(p.i>0&&p.i%6===0&&p.s.front&&p.alt>0){
      const lb=p.t.toLocaleTimeString([],{hour:'numeric'});
      ctx.beginPath();ctx.arc(p.s.x,p.s.y,11,0,7);ctx.fill();
      ctx.lineWidth=6;ctx.strokeStyle='#000d';ctx.lineJoin='round';ctx.strokeText(lb,p.s.x+16,p.s.y-16);ctx.fillText(lb,p.s.x+16,p.s.y-16)}
    const c=altaz(now),s=proj(c.azimuth,c.altitude,R),aim=camAim(R);
    const onscreen=s.front&&s.x>20&&s.x<W-20&&s.y>90&&s.y<H-90;
    ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineWidth=2;
    if(onscreen){
      ctx.beginPath();ctx.arc(s.x,s.y,16,0,7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s.x-26,s.y);ctx.lineTo(s.x-20,s.y);ctx.moveTo(s.x+20,s.y);ctx.lineTo(s.x+26,s.y);
      ctx.moveTo(s.x,s.y-26);ctx.lineTo(s.x,s.y-20);ctx.moveTo(s.x,s.y+20);ctx.lineTo(s.x,s.y+26);ctx.stroke();
      ctx.font='600 14px -apple-system,sans-serif';ctx.fillText(target.name,s.x+22,s.y-20);
    }else{
      let dx=s.d[0],dy=-s.d[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
      const r=Math.min(W,H)*.36,x=W/2+dx*r,y=H/2+dy*r,ang=Math.atan2(dy,dx);
      ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-12,-15);ctx.lineTo(-12,15);ctx.closePath();ctx.fill();ctx.restore();
    }
    const below=c.altitude<0?' <b>(below horizon)</b>':'';
    $('#info').innerHTML=`<b>${target.name}</b> az ${c.azimuth.toFixed(0)}° alt ${c.altitude.toFixed(0)}°${below}<br>Camera az ${aim.az.toFixed(0)}° alt ${aim.alt.toFixed(0)}°`;
  }
  requestAnimationFrame(frame);
}

$('#cal').onclick=()=>{
  if(!target||!obs)return;const c=altaz(new Date()),aim=camAim(rot());
  azOff+=norm(c.azimuth-aim.az);azOff=norm(azOff);ls.set('azOff',azOff);
};
const spanBtn=()=>$('#span').textContent='Path '+span+'h';spanBtn();
$('#span').onclick=()=>{span=span===6?12:span===12?24:6;ls.set('span',span);pathAt=0;spanBtn()};
$('#rst').onclick=()=>{azOff=0;ls.set('azOff',0)};

$('#begin').onclick=async()=>{
  const err=$('#err');err.textContent='';
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      if(await DeviceOrientationEvent.requestPermission()!=='granted')throw new Error('Motion access was denied. Enable it in Settings, then reopen the app.')}
    addEventListener('deviceorientation',e=>{
      ori.a=e.webkitCompassHeading!=null?360-e.webkitCompassHeading:(e.alpha||0);ori.b=e.beta||0;ori.g=e.gamma||0},true);
    vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    await vid.play();
    try{const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:15000}));
      ls.set('loc',JSON.stringify([p.coords.latitude,p.coords.longitude,p.coords.altitude||0]));
    }catch(e){if(!ls.get('loc'))throw new Error('Location access is needed to calculate the sky. Enable it in Settings.')}
    const [la,lo,el]=JSON.parse(ls.get('loc'));obs=new Astronomy.Observer(la,lo,el);
    $('#start').remove();frame();
    const last=ls.get('last');if(last){$('#q').value=last;track()}
  }catch(e){err.textContent=e.message||String(e)}
};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
